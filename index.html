<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄鹽埕美食導航 App</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system,"Noto Sans TC";
  background:#f6f6f6;
}

header{
  background:#ff6b35;
  color:#fff;
  padding:12px;
  text-align:center;
  font-weight:bold;
}

#map{
  height:45vh;
  width:100%;
}

.card{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.name{font-weight:bold;}
.addr{font-size:12px;color:#666;margin-top:4px;}

.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

a{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
}

.nav{background:#ff6b35;color:#fff;}
.line{background:#06C755;color:#fff;}
</style>
</head>

<body>

<header>📍 高雄鹽埕美食導航 App</header>

<div id="map"></div>

<div id="list"></div>

<script>

// 📍 店家資料
const places = [
{name:"鹽埕鴨肉意麵",addr:"高雄市鹽埕區大智路126號",lat:22.6232,lng:120.2840},
{name:"阿凡沙茶麻醬麵",addr:"高雄市鹽埕區大智路107號",lat:22.6228,lng:120.2836},
{name:"老蔡虱目魚粥",addr:"高雄市鹽埕區瀨南街201號",lat:22.6219,lng:120.2852},
{name:"阿財雞絲飯",addr:"高雄市鹽埕區壽星街11號",lat:22.6241,lng:120.2848},
{name:"鴨肉本",addr:"高雄市鹽埕區富野路107號",lat:22.6250,lng:120.2855},
{name:"鴨肉珍",addr:"高雄市鹽埕區大公路55號",lat:22.6238,lng:120.2829},
{name:"阿英排骨飯",addr:"高雄市鹽埕區富野路79-2號",lat:22.6246,lng:120.2860}
];

let userLat = null;
let userLng = null;

// 🗺 建立地圖（鹽埕區中心）
const map = L.map('map').setView([22.623, 120.284], 15);

// 🌍 OpenStreetMap底圖
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// 📍 店家 marker
places.forEach(p=>{
  L.marker([p.lat,p.lng])
  .addTo(map)
  .bindPopup(`<b>${p.name}</b><br>${p.addr}`);
});

// 📏 距離計算
function distance(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 📄 清單
function render(){

let list = [...places];

if(userLat){
  list.forEach(p=>{
    p.dis = distance(userLat,userLng,p.lat,p.lng);
  });
  list.sort((a,b)=>a.dis-b.dis);
}

document.getElementById("list").innerHTML =
list.map(p=>`

<div class="card">

<div class="name">${p.name}</div>
<div class="addr">
${p.addr}
${p.dis ? `<br>📏 ${p.dis.toFixed(2)} km` : ""}
</div>

<div class="actions">

<a class="nav"
href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.addr)}"
target="_blank">
🧭 導航
</a>

<a class="line"
href="https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(p.name)}&url=${location.href}"
target="_blank">
📲 LINE
</a>

</div>

</div>

`).join("");

}

// 📍 定位（關鍵修正版）
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(
(pos)=>{

userLat = pos.coords.latitude;
userLng = pos.coords.longitude;

// 📍 使用者 marker
L.marker([userLat,userLng])
.addTo(map)
.bindPopup("📍 你的位置");

map.setView([userLat,userLng],16);

render();

},
(err)=>{
console.log("定位失敗",err);
render();
}
);
}else{
render();
}

render();

</script>

</body>
</html>
