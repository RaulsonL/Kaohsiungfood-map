<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄鹽埕美食地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:-apple-system,"Noto Sans TC";background:#f6f6f6;}
header{background:#ff6b35;color:#fff;padding:12px;text-align:center;font-weight:bold;}
#map{height:45vh;width:100%;}
.bar{display:flex;gap:6px;padding:8px;background:#fff;position:sticky;top:0;z-index:10;}
button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;}
.primary{background:#ff6b35;color:#fff;}
.gray{background:#eee;}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.name{font-weight:bold;}
.tag{font-size:12px;color:#666;margin-top:4px;}
.actions{display:flex;gap:6px;margin-top:8px;}
a{flex:1;text-align:center;padding:6px;border-radius:6px;text-decoration:none;font-size:12px;}
.nav{background:#ff6b35;color:#fff;}
.map{background:#eee;color:#333;}
</style>
</head>

<body>

<header>📍 高雄鹽埕美食地圖</header>

<div id="map"></div>

<div class="bar">
<button class="primary" onclick="locate()">📍 定位</button>
<button class="gray" onclick="sortByDistance()">📏 最近</button>
<button class="gray" onclick="shareLine()">📤 分享</button>
</div>

<div id="list"></div>

<script>

const places = [
{name:"鹽埕鴨肉意麵",type:"正餐",lat:22.6232,lng:120.2841},
{name:"阿凡沙茶麻醬麵",type:"正餐",lat:22.6235,lng:120.2840},
{name:"老蔡虱目魚粥",type:"正餐",lat:22.6239,lng:120.2852},
{name:"阿財雞絲麵",type:"正餐",lat:22.6242,lng:120.2850},
{name:"鴨肉本",type:"正餐",lat:22.6228,lng:120.2835},
{name:"鴨肉珍",type:"正餐",lat:22.6226,lng:120.2833},
{name:"阿英排骨飯",type:"正餐",lat:22.6229,lng:120.2846},
{name:"汕頭陽春麵",type:"正餐",lat:22.6230,lng:120.2851},
{name:"天天沙茶火鍋",type:"正餐",lat:22.6245,lng:120.2860},
{name:"田記豆漿",type:"早餐",lat:22.6216,lng:120.2836},
{name:"樺達奶茶",type:"點心",lat:22.6221,lng:120.2839},
{name:"巴堂蜂蜜蛋糕",type:"點心",lat:22.6220,lng:120.2840}
];

let map;
let userLat,userLng;

function initMap(){

map = L.map('map').setView([22.623,120.284],16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

places.forEach(p=>{
L.marker([p.lat,p.lng])
.addTo(map)
.bindPopup(`<b>${p.name}</b><br>🚗 <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">導航</a>`);
});

render();
}

function render(){

document.getElementById("list").innerHTML =
places.map(p=>`
<div class="card" onclick="go(${p.lat},${p.lng})">
<div class="name">${p.name}</div>
<div class="tag">分類：${p.type}</div>

<div class="actions">
<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">🧭 導航</a>
<a class="map" href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank">📍 地圖</a>
</div>
</div>
`).join("");
}

function go(lat,lng){
map.setView([lat,lng],18);
}

function distance(a,b,c,d){
const R=6371;
const x=(c-a)*Math.PI/180;
const y=(d-b)*Math.PI/180;
return R*2*Math.asin(Math.sqrt(Math.sin(x/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2));
}

function locate(){
navigator.geolocation.getCurrentPosition(p=>{
userLat=p.coords.latitude;
userLng=p.coords.longitude;

places.forEach(x=>{
x.d=distance(userLat,userLng,x.lat,x.lng);
});

alert("已取得距離");
});
}

function sortByDistance(){
places.sort((a,b)=>(a.d||999)-(b.d||999));
render();
}

function shareLine(){
let text="📍高雄鹽埕美食地圖\n\n";
places.forEach(p=>{
text+=`${p.name}\nhttps://www.google.com/maps?q=${p.lat},${p.lng}\n\n`;
});

window.open(
"https://social-plugins.line.me/lineit/share?text="+encodeURIComponent(text)
);
}

initMap();

</script>

</body>
</html>
