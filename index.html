<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>高雄鹽埕美食地圖</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: Arial; }
    #map { height: 45vh; }
    .list { padding: 10px; }
    .card {
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    button {
      margin-top: 5px;
      padding: 6px 10px;
    }
  </style>
</head>

<body>

<h3 style="text-align:center;">🍜 高雄鹽埕美食地圖</h3>

<div id="map"></div>
<div class="list" id="list"></div>

<script>
const places = [
  { name: "鹽埕鴨肉意麵", lat: 22.6233, lng: 120.2840 },
  { name: "阿凡沙茶麻醬麵", lat: 22.6225, lng: 120.2835 },
  { name: "老蔡虱目魚粥", lat: 22.6218, lng: 120.2852 },
  { name: "阿財雞絲飯", lat: 22.6241, lng: 120.2848 }
];

let userLat = null;
let userLng = null;

// 初始化地圖（高雄鹽埕）
const map = L.map('map').setView([22.624, 120.284], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// 加 marker
places.forEach(p => {
  L.marker([p.lat, p.lng]).addTo(map)
    .bindPopup(p.name);
});

// 取得距離
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 建立列表
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let sorted = [...places];

  if (userLat) {
    sorted.forEach(p => {
      p.distance = getDistance(userLat, userLng, p.lat, p.lng);
    });
    sorted.sort((a,b)=>a.distance-b.distance);
  }

  sorted.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${p.name}</b><br>
      ${p.distance ? "距離：" + p.distance.toFixed(2) + " km" : ""}<br>

      <button onclick="nav(${p.lat},${p.lng})">🧭 導航</button>
      <button onclick="share('${p.name}')">📲 LINE分享</button>
    `;

    list.appendChild(div);
  });
}

// 導航（最穩版本）
function nav(lat, lng) {
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// LINE分享
function share(name) {
  const url = encodeURIComponent(location.href);
  window.open(`https://social-plugins.line.me/lineit/share?url=${url}&text=推薦你吃：${name}`);
}

// 定位
navigator.geolocation.getCurrentPosition(pos => {
  userLat = pos.coords.latitude;
  userLng = pos.coords.longitude;

  L.marker([userLat, userLng]).addTo(map)
    .bindPopup("📍 你的位置");

  map.setView([userLat, userLng], 15);

  renderList();
}, () => {
  renderList();
});

// 初始
renderList();
</script>

</body>
</html>
