<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄鹽埕美食地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:-apple-system,"Noto Sans TC";background:#f6f6f6;}
header{background:#ff6b35;color:#fff;padding:12px;text-align:center;font-weight:bold;}
#map{height:45vh;width:100%;}
.bar{display:flex;gap:6px;padding:8px;background:#fff;position:sticky;top:0;z-index:10;}
button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;}
.primary{background:#ff6b35;color:#fff;}
.gray{background:#eee;}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;}
.name{font-weight:bold;}
.small{font-size:12px;color:#666;margin-top:4px;}
a{color:#ff6b35;font-weight:bold;text-decoration:none;}
</style>
</head>

<body>

<header>📍 高雄鹽埕美食地圖</header>

<div id="map"></div>

<div class="bar">
<button class="primary" onclick="locate()">📍 定位</button>
<button class="gray" onclick="sortByDistance()">📏 最近</button>
<button class="gray" onclick="shareLine()">📤 分享</button>
</div>

<div id="list"></div>

<script>

const places = [
"鹽埕鴨肉意麵",
"阿凡沙茶麻醬麵",
"老蔡虱目魚粥",
"阿財雞絲麵",
"鴨肉本",
"鴨肉珍",
"阿英排骨飯",
"汕頭陽春麵",
"天天沙茶火鍋",
"阿姨蛋餅",
"田記豆漿",
"巴堂蜂蜜蛋糕",
"樺達奶茶"
];

let map;
let userLat,userLng;

let markers=[];

// 👉 把店名轉成真正座標（關鍵）
async function geocode(name){
const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name+" 高雄 鹽埕")}`;
const res=await fetch(url);
const data=await res.json();
if(data && data[0]){
return {
lat:parseFloat(data[0].lat),
lng:parseFloat(data[0].lon)
};
}
return null;
}

async function init(){

map=L.map('map').setView([22.623,120.284],16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

document.getElementById("list").innerHTML="載入中...";

for(let name of places){

let pos=await geocode(name);

if(pos){

let marker=L.marker([pos.lat,pos.lng]).addTo(map)
.bindPopup(`<b>${name}</b><br>
<a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${pos.lat},${pos.lng}">
🧭 導航
</a>`);

markers.push({name,lat:pos.lat,lng:pos.lng,marker});

}
}

render();
}

function render(){

document.getElementById("list").innerHTML=
markers.map(p=>`
<div class="card" onclick="go(${p.lat},${p.lng})">
<div class="name">${p.name}</div>
<div class="small">已取得精準座標</div>

<a target="_blank"
href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">
🧭 一鍵導航
</a>
</div>
`).join("");
}

function go(lat,lng){
map.setView([lat,lng],18);
}

function distance(a,b,c,d){
const R=6371;
const x=(c-a)*Math.PI/180;
const y=(d-b)*Math.PI/180;
return R*2*Math.asin(Math.sqrt(Math.sin(x/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2));
}

function locate(){
navigator.geolocation.getCurrentPosition(p=>{
userLat=p.coords.latitude;
userLng=p.coords.longitude;

markers.forEach(x=>{
x.d=distance(userLat,userLng,x.lat,x.lng);
});

alert("距離計算完成");
});
}

function sortByDistance(){
markers.sort((a,b)=>(a.d||999)-(b.d||999));
render();
}

function shareLine(){
let text="📍高雄鹽埕精準美食地圖\n\n";
markers.forEach(p=>{
text+=`${p.name}\nhttps://www.google.com/maps?q=${p.lat},${p.lng}\n\n`;
});

window.open("https://social-plugins.line.me/lineit/share?text="+encodeURIComponent(text));
}

init();

</script>

</body>
</html>
