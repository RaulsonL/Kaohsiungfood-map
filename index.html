<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄鹽埕美食路線 App</title>

<style>
body{
  margin:0;
  font-family:-apple-system,"Noto Sans TC";
  background:#f6f6f6;
}

header{
  background:#ff6b35;
  color:#fff;
  padding:14px;
  text-align:center;
  font-weight:bold;
}

.section{
  padding:10px 12px;
  font-weight:bold;
  color:#444;
}

.card{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.name{font-weight:bold;}
.addr{font-size:12px;color:#666;margin-top:4px;}

.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

a{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
}

.nav{background:#ff6b35;color:#fff;}
.line{background:#06C755;color:#fff;}

.routeBtn{
  display:block;
  margin:10px;
  padding:12px;
  background:#333;
  color:#fff;
  text-align:center;
  border-radius:10px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>🍜 高雄鹽埕一日美食路線</header>

<a class="routeBtn" href="#"
onclick="shareRoute()">
📲 分享整條美食路線（LINE）
</a>

<div id="content"></div>

<script>

// 🍽 路線設計（已排好順序）
const route = [
{
type:"早餐",
items:[
{name:"田記豆漿",addr:"高雄市鹽埕區新樂街75之3號"},
{name:"阿姨蛋餅",addr:"高雄市鼓山區鼓山一路5號1號"}
]
},
{
type:"午餐",
items:[
{name:"鴨肉本",addr:"高雄市鹽埕區富野路107號"},
{name:"鴨肉珍",addr:"高雄市鹽埕區大公路55號"},
{name:"鹽埕鴨肉意麵",addr:"高雄市鹽埕區大智路126號"}
]
},
{
type:"點心",
items:[
{name:"樺達奶茶",addr:"高雄市鹽埕區新樂街101號"},
{name:"巴堂蜂蜜蛋糕",addr:"高雄市鹽埕區大勇路127號"}
]
},
{
type:"晚餐",
items:[
{name:"天天沙茶火鍋",addr:"高雄市七賢三路240號"},
{name:"阿英排骨飯",addr:"高雄市鹽埕區富野路79-2號"}
]
}
];

// 📄 渲染
function render(){

let html = "";

route.forEach(sec=>{

html += `<div class="section">🍴 ${sec.type}</div>`;

sec.items.forEach(p=>{

html += `
<div class="card">

<div class="name">${p.name}</div>
<div class="addr">${p.addr}</div>

<div class="actions">

<a class="nav"
href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.addr)}"
target="_blank">
🧭 導航
</a>

<a class="line"
href="https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(p.name)}&url=${location.href}"
target="_blank">
📲 LINE
</a>

</div>

</div>
`;

});

});

document.getElementById("content").innerHTML = html;

}

render();

// 📲 分享整條路線
function shareRoute(){
const text =
"推薦高雄鹽埕美食路線：田記豆漿 → 鴨肉本 → 樺達奶茶 → 天天沙茶火鍋";

const url =
"https://social-plugins.line.me/lineit/share?text="
+ encodeURIComponent(text)
+ "&url="
+ encodeURIComponent(location.href);

window.open(url,"_blank");
}

</script>

</body>
</html>
